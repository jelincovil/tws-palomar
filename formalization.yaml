automation:
  methods:
    - method: agent
      models: ["Grok 4"]
      framework: n/a
      tool_setup: >-
        Palomar packaging assembled by an xAI Grok 4 agent from
        human-written Lean in tws-repro. Kernel and QMF proofs were
        written earlier as Lean tactics (simp, norm_num, ring).
      cost:
        wall_time: "under two hours for the Palomar surface"
        spend_usd: 0
        hardware: local machine
      prompting_notes: >-
        Map main.tex labels only to closed Lean declarations. Do not
        submit bottleneck stability as a kernel proof. Kernel ℓ¹ is not
        the finite-grid operator norm.
    - method: manual
      models: []
      framework: n/a
      tool_setup: "Human-authored TWS.DaubechiesOpNorm.lean and TWS.Skeleton.lean"
      cost:
        wall_time: "weeks (companion development; not tracked)"
        spend_usd: 0
        hardware: local machine
      prompting_notes: n/a
  spend_usd: 0
  notes: >-
    Mixed: human Lean proofs authored in jelincovil/tws-repro (MIT) and
    vendored into TWS/ of this Apache-2.0 Palomar surface at commit
    6f11e6e37039c40fd924146e2d5efdd531950179.

fidelity:
  divergences: >-
    Kernel theorems are ℓ¹ sums of taps, not ‖P_{0,N}‖_{L∞→L∞}=(9/8)^d.
    l2_norm_rev_tri uses mathlib MemLp and eLpNorm of U.indicator with
    Lebesgue volume on ℝ. energy_stability is |a²−b²|≤Γ(a+b), not the full
    landscape-squared statement of cor:energy. Challenge.lean and
    Solution.lean are Mathlib-only: they inline the definitions they need
    rather than importing the vendored TWS/ modules, so the Challenge's
    transitive import closure contains no project-specific code.

review:
  status: self-assessed
  reviewers: []
  notes: >-
    Statement selection checked against main.tex and against #print axioms
    {propext, Classical.choice, Quot.sound}. Local Comparator (Lean kernel
    and NanoDa) accepted the solution. No independent mathematical referee
    has reviewed this Palomar surface.

