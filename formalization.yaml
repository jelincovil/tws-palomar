status:
  scope: Complete candidate proof scripts for a finite real convolution operator, its exact
    sup norm, folding of signed stencils, separable products, level-one db2 on N >= 7, and
    the exact undecimated cascade norms at levels 1, 2 and 3, and the closed form for every
    level. No custom axioms or proof holes occur in Solution.lean. Twenty-two theorems are
    selected. The earlier Darwin Comparator replay without bubblewrap accepted the fourteen
    statements of that date.
    GitHub Actions run 39040759159 then ran the sandboxed script successfully, and
    Palomar verification run 39042287485 accepted commit
    e6698f352a4362e01ed84e4e6ece13d0cf431d6d. Registration was not offered. Only the
    compared statements in Challenge.lean contain deliberate sorry holes. Supplied Lipschitz
    hypotheses are not proofs of bottleneck stability or of landscape non-expansiveness.
    The closed form, the uniform bound and the least constant are selected statements.
    Standard facts are not claimed as new mathematics. The period-one operator for
    positive dimension is covered by the uniform inequality; a separate identity that
    its norm equals 1 is not selected.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
