version: "v0.4"

project:
  name: "Algebraic composition of a localized landscape bound, and exact ℓ¹ of the db2 seven-tap kernel"
  description: >-
    Comparator surface for the two Lean-checked facts of the companion
    short note. Fact 1: if a landscape L∞-Lipschitz hypothesis and an L∞
    operator bound are supplied, the L²(U) composition inequality follows
    (Palomar.stability_Linf / TWS.stability_Linf). Bottleneck stability
    and landscape non-expansiveness are named hypotheses, not proofs.
    Fact 2: the seven-tap kernel k₀ = ½R_h has ℓ¹ norm 9/8, and the
    separable 2-D row-sum of |k_i k_j| is (9/8)². Lean does not prove
    that the finite-grid operator norm equals the kernel ℓ¹-norm; that
    identification (no-cancellation under periodization, N≥7) remains a
    paper argument. This repository does not contain the LaTeX manuscript.
    The TWS/ sources are vendored from jelincovil/tws-repro (MIT) at
    commit 6f11e6e37039c40fd924146e2d5efdd531950179 so Palomar's isolated
    lean invocation can find TWS.olean.
  authors:
    - "Jaime Enrique Lincovil Curivil"
    - "César Daniel Reinoso Reinoso"
    - "Niels Pacheco-Barrios"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Jaime Enrique Lincovil Curivil"

classification:
  arxiv: ["math.AT", "math.FA"]
  msc2020: ["55N31", "42C40", "68V20", "62R40"]

