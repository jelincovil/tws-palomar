version: v0.4
project:
  name: Exact sup-operator norms for periodic db2 smoothing
  description: 'A proposed source-based formalization of finite-grid db2 operator
    norms. The explicit real convolution is a Mathlib continuous linear map on finite Pi spaces
    with their sup norm. Proof scripts establish the general convolution norm formula, a periodization
    bound with injective-offset equality, separable tensorization, and the level-one db2 value (9/8)^d
    on every periodic grid of side N >= 7. The same theorem gives the exact undecimated cascade norms
    (299/256)^d for N >= 19, (9663/8192)^d for N >= 43 and (309991/262144)^d for N >= 91.
    These three values agree with the closed form proved for every level. For every
    j and every N at least the support, the norm is c_j^d with
    c_j = 1651/1395 - (4/63)4^{-j} + (1/180)16^{-j} - (1/1736)32^{-j}.
    For every positive period, aliasing included, the norm is at most (1651/1395)^d,
    and that power is the least such common bound. The free mass increases strictly
    and the gap is at most (4/63)4^{-j}. Dimension zero is exactly 1. N >= support
    is sufficient, not claimed necessary. A fixed period is not claimed to attain the limit.
    A unit sign signal attains the level-one smoothing norm.
    The orthonormal db2 filter and its half-autocorrelation are explicitly connected. A conditional
    propagation then carries a supplied summary Lipschitz bound and a supplied seminorm comparison
    through the level-one operator, giving the factor L*(9/8)^d*sqrt(mu). The db2 norm is proved to be the
    least such operator constant, and the squared-summary difference obeys the corresponding
    product bound. Bottleneck stability, persistence diagrams and landscape non-expansiveness are
    hypotheses, not theorems. Twenty-two statements are selected. The earlier fourteen
    elaborated under Lean v4.35.0-rc2.
    A local Comparator replay on Darwin, without bubblewrap, accepted the extended list on
    2026-10-17. GitHub Actions run 39040759159 later ran the sandboxed Comparator script
    on commit e6698f352a4362e01ed84e4e6ece13d0cf431d6d, and Palomar verification run
    39042287485 accepted that commit. Registration was not offered.'
  authors:
  - Jaime Enrique Lincovil Curivil
  - César Daniel Reinoso Reinoso
  - Niels Pacheco-Barrios
  license: Apache-2.0
  responsible_maintainers:
