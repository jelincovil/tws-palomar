fidelity:
  divergences: The source manuscript includes bottleneck stability, persistence diagrams,
    landscape non-expansiveness, numerical kernels beyond cascade level three, and
    application experiments. Those ingredients are not proved. Equation (10) prints
    rounded decimals; the formalization proves the exact rationals at levels 1, 2 and 3
    for periods at least 19, 43 and 91, and then the closed form at every level. The
    closed form is not in the manuscript. N >= support is sufficient, not necessary.
    The least uniform constant allows the period to grow with the level. At dimension
    zero that theorem concludes 1 ≤ B and does not conclude B = 1. The summary bounds
    assume a Lipschitz hypothesis and a seminorm comparison. The general norm and tensor
    identities are standard. The cascade formula is not claimed to be new relative to
    the wavelet literature; see docs/RELATED_WORK.md.
