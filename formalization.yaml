status:
  scope: 'Proved scripts for the finite real convolution norm, folding, separable
    products, the level-one db2 norm on N >= 7, the exact cascade norms at levels
    1, 2 and 3, and the closed form for every level together with the uniform bound,
    its least constant, the free-mass gap, increase and limit, and dimension zero.
    No custom axioms or proof holes occur in Solution.lean. Nineteen theorems are
    selected. Alignment status below describes correspondence with the informal
    statement, not whether a sandbox run has finished. The run chronology is in
    review.notes and docs/VERIFICATION.md. Supplied Lipschitz hypotheses are not
    proofs of bottleneck stability or of landscape non-expansiveness. The period-one
    operator for positive dimension is covered by the uniform inequality; a separate
    identity that its norm equals 1 is not selected. Priority relative to the
    literature is unresolved.'
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
  - propext
  - Classical.choice
  - Quot.sound
