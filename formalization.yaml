fidelity:
  divergences: The source manuscript includes bottleneck stability, persistence diagrams, landscape
    non-expansiveness, numerical kernels beyond cascade level three, and application experiments.
    Those ingredients are not proved. Cascade levels 1, 2 and 3 are formalized as exact rational
    operator norms of the free integer kernels, for periods at least 19, 43 and 91. What is
    formalized beyond those operator norms is the algebraic propagation of a supplied Lipschitz
    hypothesis and a supplied seminorm comparison, together with sharpness of the level-one
    smoothing constant and the squared-summary product bound. The development uses Mathlib
    finite Pi norms and ContinuousLinearMap operator norms, supports arbitrary dimension d including
    zero, assumes a nonzero period, and does not certify any external implementation.
    Operator-norm attainment does not imply attainment of a composed landscape bound. The general
    norm and tensor identities are standard. The cascade closed form is now a selected
    statement. It is not claimed to be new relative to the wavelet literature.
review:
  status: Local Darwin checks of the closed form passed on 2026-10-18; the Linux sandbox for this revision is outstanding. Registration was not offered for the earlier commit.
  reviewers: []
  notes: Static checks, exact finite-instance checks, `lake build`, `#print axioms` and the
    Darwin Comparator replay are recorded in docs/VERIFICATION.md. Each of the fourteen selected
    theorems depends only on propext, Classical.choice and Quot.sound. The Darwin replay included
    the three cascade-level norms and used `--inadvisably-no-sandbox` because bubblewrap is absent
    on that machine. GitHub Actions run 39040759159 then ran the sandboxed script on commit
    e6698f352a4362e01ed84e4e6ece13d0cf431d6d and succeeded. Palomar verification run 39042287485
    accepted that commit. The automated editorial review identified problems and did not offer
    registration. On 2026-10-18 an unsandboxed Darwin Comparator replay accepted
    all twenty-two selected statements, including the eight cascade-formula
    theorems. That replay used `--inadvisably-no-sandbox`. It is not the Linux
    sandbox check. The earlier runs do not cover those eight statements.
