# formalization.yaml v0.4
version: "v0.4"

project:
  name: "Exact ℓ¹ norm of the undecimated db2 seven-tap kernel, and two auxiliary algebraic lemmas"
  description: >-
    Comparator surface for the Lean-checked facts of the companion short
    note. The seven-tap kernel k₀ = ½R_h has ℓ¹ norm 9/8, and the separable
    2-D row-sum of |k_i k_j| is (9/8)²; the same ℓ¹ identity is restated via
    the QMF half-autocorrelation. Two auxiliary algebraic results are
    included: the reverse triangle inequality for the L² seminorm on a set,
    and the algebraic core of the paper's energy corollary. Lean does not
    prove that the finite-grid operator norm equals the kernel ℓ¹-norm; that
    identification (no-cancellation under periodization, N≥7) remains a
    paper argument. This repository does not contain the LaTeX manuscript.
    This entry does not cover the paper's Theorem A composition; that
    theorem is a chained inequality under named hypotheses and is not
    registered. The TWS/ sources are vendored from jelincovil/tws-repro (MIT)
    at commit 6f11e6e37039c40fd924146e2d5efdd531950179 as the provenance of
    the inlined definitions and proof tactics; Challenge.lean and
    Solution.lean are Mathlib-only and import no project-specific module.
  authors:
    - "Jaime Enrique Lincovil Curivil"
    - "César Daniel Reinoso Reinoso"
    - "Niels Pacheco-Barrios"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Jaime Enrique Lincovil Curivil"

classification:
  arxiv: ["math.AT", "math.FA"]
  msc2020: ["55N31", "42C40", "68V20", "62R40"]

sources:
  - title: "Explicit L-infinity stability bounds for undecimated Daubechies smoothing and wavelet-filtered persistence landscapes"
    authors:
      - "Jaime Enrique Lincovil Curivil"
      - "César Daniel Reinoso Reinoso"
      - "Niels Pacheco-Barrios"
    id: "arXiv:XXXX.XXXXX"
    type: article
    location: "tws-persistence-stability/paper/main.tex (not in this repository); arXiv identifier is a placeholder until deposit"
    relationship: formalizes
    note: >-
      Compared theorems are the kernel ℓ¹ identities used in prop:opnorm (not
      the operator-norm identification), lem:revtri, and the algebraic core of
      cor:energy. Not compared: the Theorem A composition (thm:A), which is a
      chained inequality under named hypotheses, together with lem:landscapeU,
      lem:proj as a general operator-norm fact, prop:sharp, and cor:global.
    license: CC-BY-4.0
    author_endorsement: participated

