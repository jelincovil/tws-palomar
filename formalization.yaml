version: v0.4
project:
  name: Exact db2 cascade norms and an optimal uniform constant
  description: 'Exact supremum-operator norms for the undecimated periodic db2 cascade.
    For every level j and every period N at least the support, the norm is c_j^d, where
    c_j = 1651/1395 - (4/63)4^{-j} + (1/180)16^{-j} - (1/1736)32^{-j}.
    For every positive period, aliasing included, the norm is at most (1651/1395)^d,
    and that power is the least constant with this uniform role. The free mass is
    strictly increasing, converges to 1651/1395, and the gap is at most (4/63)4^{-j}.
    Dimension zero is exactly 1. N at least the support is sufficient, not claimed
    necessary, and one fixed period is not claimed to attain the limit. At dimension
    zero the least-constant conclusion is 1 ≤ B; it does not force B = 1.
    The level-one kernel is the seven-tap half-autocorrelation, with norm (9/8)^d
    for N >= 7. Levels 1, 2 and 3 remain the exact values (299/256)^d, (9663/8192)^d
    and (309991/262144)^d for N >= 19, 43 and 91. Bibliographic priority of the
    closed form is unresolved; see docs/RELATED_WORK.md. A conditional propagation
    then carries a supplied summary Lipschitz bound and a supplied seminorm comparison
    through the level-one operator. Bottleneck stability, persistence diagrams and
    landscape non-expansiveness are hypotheses, not theorems. Those conditional
    statements are retained in the sources as auxiliaries and are not selected.
    Nineteen statements are selected. They are parts of this development, not nineteen
    independent contributions. The exposition of the cascade argument is
    docs/CASCADE_THEOREM.md.'
  authors:
  - Jaime Enrique Lincovil Curivil
  - César Daniel Reinoso Reinoso
  - Niels Pacheco-Barrios
  license: Apache-2.0
  responsible_maintainers:
  - Jaime Enrique Lincovil Curivil
