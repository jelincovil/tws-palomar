  reviewers: []
  notes: 'No peer review and no author-verification beyond the maintainer''s audit are
    recorded. Alignment status is mathematical correspondence, not an execution flag.
    Chronology of checks. On 2026-10-17 an unsandboxed Darwin Comparator replay
    accepted the fourteen statements then selected, on a tree whose later public
    commit is e6698f352a4362e01ed84e4e6ece13d0cf431d6d. GitHub Actions run 39040759159
    then ran scripts/verify-all.sh with bubblewrap on that commit, and Palomar
    verification run 39042287485 accepted it. The automated editorial review did not
    offer registration. Those three checks do not cover the closed form. On 2026-10-18
    the closed form was proved in commit 7295c00346b8295d4857a3b2f24a6ad0c037d256.
    An unsandboxed Darwin replay (`--inadvisably-no-sandbox`) accepted all twenty-two
    statements. GitHub Actions run 39093434816 ran the sandboxed script on that commit
    and succeeded. Run 39093722987 repeated the sandboxed script on the docs-only
    child b9fd1a87127c80bd4099c8f509abfa201fef8ea1 and succeeded. A later revision
    changes only comments in Challenge.lean and Solution.lean. On 2026-10-18 that
    tree was rebuilt on Darwin with Lean v4.35.0-rc2: lake build exited 0, AxiomAudit
    reported only propext, Classical.choice and Quot.sound for all twenty-two
    theorems, and an unsandboxed Comparator replay printed the sandbox warning and
    accepted the solution (con-ron, 16500 declarations). bwrap is absent, so
    scripts/verify-comparator.sh was not that command. The proof terms are those
    of 7295c00. Commit 1121b6d5d00ab04be218fea36a4eb36d5990f287, which contains
    those comments, was pushed and sandboxed by GitHub Actions run 39096555323.
    That log records bubblewrap, the static pass for 22 statements, and
    Your solution is okay! Runs 39093434816 and 39093722987 remain the checks
    of 7295c00 and b9fd1a8. Run 39096555323 does not cover a later commit that
    only records it. Nothing has been registered. A later submission of this line of
    work passed mechanical verification, but its automated editorial review rejected
    the research interest of the three conditional summary statements. The submission
    identifier and the exact submitted SHA are not recorded; see
    docs/PALOMAR_CANDIDACY.md. Mechanical success is not registration.'
alignment:
  namespace: TWSPeriodic
  statements:
  - source: General finite convolution norm identity used in Proposition 3.4
    lean: TWSPeriodic.convolution_opNorm
    module: Challenge
    status: proved
    note: 'The supremum operator norm of convolution on a finite abelian group equals
      the l1 mass of the kernel. Proved in Solution.lean as convolution_opNorm, from
      the triangle inequality and the sign signal. Scope is every finite abelian
      group, not only Z/NZ. The manuscript uses the identity inside Proposition 3.4;
      it does not isolate it as a separate numbered theorem. Checks: the fourteen-statement
      Darwin replay, Actions 39040759159 and Palomar 39042287485 on e6698f3, and the
      twenty-two-statement Darwin replay and Actions 39093434816 on 7295c00.'
  - source: Periodization bound and sufficient no-collision condition in Proposition 3.4
    lean: TWSPeriodic.periodization_norm
    module: Challenge
    status: proved
    note: 'Folding never increases l1 mass, and injective offsets preserve it.
      Injectivity is sufficient, not necessary. Proved as periodization_norm from
      foldKernel_l1_le and foldKernel_l1_eq. Same check chronology as convolution_opNorm.
      The manuscript is not claimed to contain a necessity statement.'
  - source: Separable dimension factor in Proposition 3.4
    lean: TWSPeriodic.tensor_convolution_opNorm
    module: Challenge
    status: proved
    note: 'The l1 mass of a pure tensor power is the d-th power of the one-dimensional
      mass, including d = 0, where both sides equal 1. Proved as tensor_convolution_opNorm.
      Same check chronology as convolution_opNorm.'
  - source: Level-one db2 half-autocorrelation computation in Proposition 3.4
    lean: TWSPeriodic.db2_filter_identification
    module: Challenge
    status: proved
    note: 'The seven taps equal one half of the symmetric autocorrelation of the
      explicit orthonormal db2 filter. The arithmetic adapts the MIT predecessor and
      is reproved here (R0 through autocorr_three). Same check chronology as
      convolution_opNorm. Saito and Beylkin identify the same taps, up to a factor
      two in their a_k; see docs/RELATED_WORK.md. That identification is background,
      not a line of this proof.'
  - source: Proposition 3.4, exact level-one periodic norm
    lean: TWSPeriodic.db2_opNorm
    module: Challenge
    status: proved
    note: 'For every d and every N >= 7, the db2 operator norm is (9/8)^d. The
      hypothesis N >= 7 is a sufficient no-collision condition, not a claim that 7
      is minimal. Proved as db2_opNorm from db2Kernel_l1 and tensor_convolution_opNorm.
      This is c_0. Same check chronology as convolution_opNorm.'
  - source: Attainment of the smoothing operator norm (not the TDA composition)
    lean: TWSPeriodic.db2_attains
    module: Challenge
    status: proved
    note: 'A unit-norm sign signal attains (9/8)^d for the smoothing operator when
      N >= 7. Proved as db2_attains. Attainment is not claimed for a persistence
      summary. Same check chronology as convolution_opNorm.'
  - source: Perturbation consequence of the exact smoothing norm
    lean: TWSPeriodic.db2_lipschitz
    module: Challenge
    status: proved
    note: 'Linearity gives ||P f - P g|| <= (9/8)^d ||f - g|| for N >= 7. Proved as
      db2_lipschitz. Same check chronology as convolution_opNorm.'
  - source: Lemma 3.2, least certified smoothing constant
    lean: TWSPeriodic.db2_opNorm_least
    module: Challenge
    status: proved
    note: 'Any constant that bounds the level-one db2 operator is at least (9/8)^d.
      This is sharpness of the smoothing factor, not of a persistence summary.
      Proved as db2_opNorm_least. Same check chronology as convolution_opNorm.'
  - source: Exact undecimated db2 cascade norm at level one, for N >= 19
    lean: TWSPeriodic.cascade_level1_opNorm
    module: Challenge
    status: adapted
    note: 'The manuscript prints a rounded two-dimensional value. The formal
      statement is the exact norm (299/256)^d for every N >= 19, obtained by
      deciding the nineteen-tap integer mass 1196 at scale 1024. The two-dimensional
      square is 89401/65536. Adapted because of that exact rational form and the
      explicit sufficient period. Agrees with c_1. Included in the fourteen-statement
      checks of e6698f3 and in the twenty-two-statement checks of 7295c00.'
  - source: Exact undecimated db2 cascade norm at level two, for N >= 43
    lean: TWSPeriodic.cascade_level2_opNorm
    module: Challenge
    status: adapted
    note: 'Exact norm (9663/8192)^d for N >= 43, from the integer mass 38652 at
      scale 32768. The two-dimensional square is 93373569/67108864. Adapted for the
      same reason as level one. Agrees with c_2. Same check chronology as level one.'
  - source: Exact undecimated db2 cascade norm at level three, for N >= 91
    lean: TWSPeriodic.cascade_level3_opNorm
    module: Challenge
    status: adapted
    note: 'Exact norm (309991/262144)^d for N >= 91, from the integer mass 1239964
      at scale 1048576. The two-dimensional square is 96094420081/68719476736.
      Adapted for the same reason as level one. Agrees with c_3. Same check
      chronology as level one. The general closed form is a separate statement.'
  - source: Exact periodized l1 mass of every cascade level when N is at least the support
    lean: TWSPeriodic.cascade_l1_formula
    module: Challenge
    status: proved
    note: 'For every j and every N >= S_j, the folded kernel has l1 mass c_j.
      The free mass m_j equals the same expression with no hypothesis on N; that
      identity is the lemma cascade_l1_series, and cascade_l1_all identifies it
      with the folded mass once N >= S_j. The condition is sufficient, not necessary.
      The manuscript does not state c_j. Proved in Solution.lean; exposition in
      docs/CASCADE_THEOREM.md. Checks: unsandboxed Darwin replay on 2026-10-18 and
      Actions 39093434816 on 7295c00. Not covered by 39040759159 or Palomar 39042287485.'
  - source: Exact operator norm of every cascade level without aliasing
    lean: TWSPeriodic.cascade_opNorm_formula
    module: Challenge
    status: proved
    note: 'For every j, every d including zero, and every N >= S_j, the separable
      convolution norm equals c_j^d. Proved as cascade_opNorm_formula from
      cascade_opNorm_all and cascade_l1_series. Same scope note and same 2026-10-18
      checks as cascade_l1_formula. The manuscript does not state this formula.'
  - source: Uniform cascade bound for every positive period
    lean: TWSPeriodic.cascade_opNorm_uniform
    module: Challenge
    status: proved
    note: 'For every j, every d, and every N >= 1, the operator norm is at most
      (1651/1395)^d. Aliasing is allowed. At d = 0 the right-hand side is 1.
      Proved as cascade_opNorm_uniform from foldKernel_l1_le and absMass_gap.
      Same 2026-10-18 checks as cascade_l1_formula.'
  - source: Explicit gap between the free cascade mass and 1651/1395
    lean: TWSPeriodic.cascade_l1_gap
    module: Challenge
    status: proved
    note: 'The free mass m_j does not depend on N. It is strictly below 1651/1395,
      and the difference is at most (4/63)4^{-j}. Proved as cascade_l1_gap from
      free_l1 and absMass_gap. Same 2026-10-18 checks as cascade_l1_formula.'
  - source: Strict increase of the free cascade mass
    lean: TWSPeriodic.cascade_l1_succ_lt
    module: Challenge
    status: proved
    note: 'm_j < m_{j+1}, with no hypothesis on N and no claim about the
      zero-dimensional operator norm. Proved as cascade_l1_succ_lt from free_l1
      and absMass_succ_lt. Same 2026-10-18 checks as cascade_l1_formula.'
  - source: Convergence of the free cascade mass
    lean: TWSPeriodic.cascade_l1_tendsto
    module: Challenge
    status: proved
    note: 'm_j converges to 1651/1395. Proved as cascade_l1_tendsto from free_l1
      and absMass_tendsto. Same 2026-10-18 checks as cascade_l1_formula.'
  - source: Least uniform constant of the whole cascade
    lean: TWSPeriodic.cascade_uniform_constant_least
    module: Challenge
    status: proved
    note: 'Any real B that bounds the operator at every level and every positive
      period is at least (1651/1395)^d. The witnessing periods are the supports
      and may grow with the level. A single fixed period is not claimed to attain
      the constant. At d = 0 the conclusion is 1 ≤ B; it does not force B = 1.
      Proved as cascade_uniform_constant_least from cascade_opNorm_all,
      absMass_tendsto and le_of_tendsto''. Same 2026-10-18 checks as cascade_l1_formula.'
  - source: Dimension zero of every cascade operator
    lean: TWSPeriodic.cascade_opNorm_d_zero
    module: Challenge
    status: proved
    note: 'For every level and every positive period, including periods that alias,
      the zero-dimensional operator norm is exactly 1. Proved as cascade_opNorm_d_zero
      from tensor_convolution_opNorm and pow_zero. This is separate from the
      least-constant inequality. Same 2026-10-18 checks as cascade_l1_formula.'
