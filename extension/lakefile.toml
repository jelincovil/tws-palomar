# Independent extension package for the threshold certificate.
# It does NOT modify the baseline lakefile.toml / lake-manifest.json / lean-toolchain
# in the parent directory.  It depends on the baseline package by relative path and
# reuses the baseline's already-downloaded dependency checkout (same Mathlib pin).
name = "tws-threshold-extension"
version = "0.1.0"
defaultTargets = ["ThresholdExtension"]
packagesDir = "../.lake/packages"

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

# Same Mathlib pin as the baseline lakefile.toml.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "065356127b1dc0016f66b7283ce0ce2c4055aa55"

# The baseline package itself (provides the `Solution` module, namespace TWSPeriodic).
[[require]]
name = "tws-palomar"
path = ".."

[[lean_lib]]
name = "ThresholdExtension"
roots = ["ThresholdExtension.ThresholdCertificate", "ThresholdExtension.Db2ThresholdCertificate",
         "ThresholdExtension.EndpointReplication", "ThresholdExtension.NonperiodicDb2Certificate",
         "ThresholdExtension.ConstantPreservation"]
